<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altrium - Job Board</title>
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
  </script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/Candidate.css?v=20260824">
</head>

<body>
  <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle theme">
    <i id="theme-toggle-icon" data-lucide="sun"></i>
  </button>
  <button class="mobile-menu-btn" title="Menu">
    <i data-lucide="menu"></i>
  </button>
  <div class="sidebar-backdrop"></div>
  <div class="mobile-topbar">
    <img src="../images/Altrium-logo-1.png" alt="Altrium logo" class="brand-logo-img for-light">
    <img src="../images/Altrium-logo-white.png" alt="Altrium logo" class="brand-logo-img for-dark">
  </div>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <button class="sidebar-close-btn" title="Close menu">
        <i data-lucide="x"></i>
      </button>
      <div class="sidebar-top">
        <div class="brand">
          <img src="../images/Altrium-logo-1.png" alt="Altrium logo" class="brand-logo-img for-light">
          <img src="../images/Altrium-logo-white.png" alt="Altrium logo" class="brand-logo-img for-dark">
          <span class="brand-label">Candidate</span>
        </div>

        <nav class="nav-menu">
          <a href="#" class="nav-item active" id="nav-jobs" onclick="switchView('job-board')">
            <i data-lucide="search"></i>
            <span>Browse Jobs</span>
          </a>
          <a href="#" class="nav-item" id="nav-applications" onclick="loadUserApplications()">
            <i data-lucide="file-text"></i>
            <span>My Applications</span>
          </a>
          <a href="#" class="nav-item" id="nav-profile" onclick="loadUserProfile()">
            <i data-lucide="user"></i>
            <span>My Profile</span>
          </a>
          <a href="#" class="nav-item" id="nav-notifications" onclick="loadUserNotifications()">
            <i data-lucide="bell"></i>
            <span>Notifications</span>
            <span class="badge" id="notif-badge" style="display: none;"></span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="user-profile">
          <div class="avatar" id="sidebar-avatar">SC</div>
          <div class="user-info">
            <span class="name" id="sidebar-name">Sarah Chen</span>
            <span class="email" id="sidebar-email">sarah@example.com</span>
          </div>
        </div>
        <button class="sign-out-btn" onclick="window.location.href='../api/logout.php'">
          <i data-lucide="log-out"></i>
          <span>Sign Out</span>
        </button>
        <button class="collapse-btn">
          <i data-lucide="chevron-left"></i>
          <span>Collapse</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="header">
        <h1>Job Board</h1>
        <p>Browse open positions and find your next opportunity</p>
      </header>

      <!-- Search & Filter Bar -->
      <div class="search-container">
        <div class="search-input-wrapper">
          <i data-lucide="search" class="search-icon"></i>
          <input type="text" id="job-search-input" placeholder="Search by keyword, title, or description...">
        </div>
        <div class="filter-wrapper">
          <button class="filter-btn" id="filter-toggle-btn" onclick="toggleFilterDropdown()">
            <i data-lucide="sliders-horizontal"></i>
            <span>Filters</span>
            <span class="filter-count-badge" id="filter-count-badge" style="display:none;"></span>
          </button>
          <div class="filter-dropdown" id="filter-dropdown" style="display:none;">
            <div class="filter-group">
              <label>Category</label>
              <select id="filter-category-select">
                <option value="">All Categories</option>
              </select>
            </div>
            <div class="filter-group">
              <label>Job Type</label>
              <select id="filter-type-select">
                <option value="">All Types</option>
              </select>
            </div>
            <button class="filter-clear-btn" id="filter-clear-btn" onclick="clearJobFilters()">Clear filters</button>
          </div>
        </div>
      </div>

      <div class="results-count"><span id="job-count">5</span> open positions</div>

      <!-- Content Split View Area -->
      <div class="content-body" id="content-body">
        <!-- Jobs List -->
        <div class="jobs-list" id="jobs-list">
          <!-- Cards populated by JS -->
        </div>

        <!-- Detail View Panel (Initially hidden until clicked) -->
        <div class="job-detail-panel" id="job-detail-panel">
          <!-- Detail View Content populated dynamically -->
        </div>
      </div>

      <!-- Application Form Section (Hidden by default) -->
      <div class="application-view" id="application-view" style="display: none;"></div>

      <!-- My Applications Section (Hidden by default) -->
      <div class="applications-container" id="applications-container" style="display: none;"></div>

      <!-- My Profile Section (Hidden by default) -->
      <div class="profile-container" id="profile-container" style="display: none;"></div>

      <!-- Notifications Section (Hidden by default) -->
      <div class="notifications-container" id="notifications-container" style="display: none;"></div>
    </main>
  </div>

  <script src="../assets/js/theme.js?v=20260824"></script>
  <script src="../assets/js/Candidate.js?v=20260824"></script>
</body>

</html>
